[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leitor-rfa"
version = "0.1.0"
description = "Conversor de família do Revit (.rfa) para o BIMCraft, sem o Revit: lê o arquivo e exporta JSON, 3D e a família BIMCraft"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["olefile>=0.47"]
keywords = ["revit", "rfa", "bim", "bimcraft", "converter", "reverse-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Natural Language :: Portuguese (Brazilian)",
]

[project.urls]
Repository = "https://github.com/bandleo/leitor-rfa"

[project.optional-dependencies]
dev = ["pytest>=9"]
3d = ["numpy", "ifcopenshell"]  # só o medidor (scripts/medir_geometria.py); o 3D do leitor é Python puro

[project.scripts]
ler-rfa = "leitor_rfa.cli:main"

[tool.setuptools]
packages = ["leitor_rfa"]

[tool.setuptools.package-data]
leitor_rfa = ["tabelas.json", "web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
