name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar
        run: python -m pip install .[dev]
      # Roda contra o pacote instalado (não o código da pasta). Sem LEITOR_RFA_FIXTURES,
      # os testes que precisam de .rfa reais são pulados.
      - name: Testes
        env:
          PYTHONUTF8: "1"
        run: pytest -q
